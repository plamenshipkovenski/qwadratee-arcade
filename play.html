<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBQUADRATEE - Игрална Арена</title>
    <!-- GSAP за гладки анимации на радио-копчето -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Хедър / Информация за играча */
        .game-header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .player-avatar {
            font-size: 1.5rem;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Игрално поле (Арена 2x2) */
        .arena-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 24px;
            border: 2px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .quadrant {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .quadrant:hover {
            border-color: var(--accent-color);
        }

        /* Елементи за управление долу */
        .game-footer {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.2);
            color: #f43f5e;
        }
    </style>
</head>
<body>

    <!-- Хедър с данни от localStorage -->
    header class="game-header">
        <div class="player-info">
            <span class="player-avatar" id="displayAvatar">🐸</span>
            <span id="displayName">Играч</span>
        </div>
        <div class="game-stats">
            <div>Точки: <span id="score">0</span></div>
            <div>Време: <span id="timer">60</span>s</div>
        </div>
    </header>

    <!-- Игрална Арена с 4 квадранта (Радио-копчета) -->
    <div class="arena-container" id="arena">
        <div class="quadrant" data-index="0">🔴</div>
        <div class="quadrant" data-index="1">🔵</div>
        <div class="quadrant" data-index="2">🟢</div>
        <div class="quadrant" data-index="3">🟡</div>
    </div>

    <!-- Долен контролен панел -->
    <div class="game-footer">
        <button class="btn" id="btnBack">Изход в менюто</button>
    </div>

    <script>
        // 1. Зареждане на запазените данни от localStorage
        const playerName = localStorage.getItem('quadratee_name') || 'Играч';
        const playerAvatar = localStorage.getItem('quadratee_avatar') || '🐸';
        
        document.getElementById('displayName').textContent = playerName;
        document.getElementById('displayAvatar').textContent = playerAvatar;

        // Четене на URL параметри (Соло или Мултиплейър стая)
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'solo';
        const roomCode = urlParams.get('room');
        
        if (mode === 'multi') {
            console.log(`Мултиплейър режим в стая: ${roomCode}`);
        }

        // 2. Радио-копче логика с GSAP и натрупване на ъгъла (Additive Rotation)
        const quadrants = document.querySelectorAll('.quadrant');

        quadrants.forEach(quad => {
            // Пазим текущия натрупан ъгъл за всеки квадрант поотделно
            let currentRotation = 0;

            quad.addEventListener('click', () => {
                // Прибавяме точно 90 градуса при всяко цъкане
                currentRotation += 90;

                // GSAP анимация с пружиниращ ефект (тип радио-копче)
                gsap.to(quad, {
                    rotation: currentRotation,
                    duration: 0.4,
                    ease: "back.out(1.7)", // Приятен тактилен отскок в края
                    overwrite: "auto"      // Позволява бързи повторни тапове без забиване
                });
            });
        });

        // Бутон за връщане назад
        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Анимация при зареждане на арената
        gsap.from('.arena-container', { duration: 0.6, scale: 0.8, opacity: 0, ease: 'power2.out' });
    </script>
</body>
</html>
