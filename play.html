<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBQUADRATEE - Игрална Арена</title>
    <!-- GSAP за плавните анимации -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.25);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Хедър / Информация за играча */
        .game-header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .player-avatar {
            font-size: 1.5rem;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Игрална Арена */
        .arena-container {
            position: relative;
            width: 340px;
            height: 340px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .quadrant {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            padding: 10px;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .quadrant:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(30, 41, 59, 0.45);
        }

        /* Топчета - Перфектна палитра */
        .ball {
            width: 82%;
            height: 82%;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.6), 0 3px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .ball-magenta { background: radial-gradient(circle at 30% 30%, #ff2a6d, #990033); }   /* 40% */
        .ball-indigo  { background: radial-gradient(circle at 30% 30%, #05d9e8, #005f73); }   /* 30% */
        .ball-gold    { background: radial-gradient(circle at 30% 30%, #ffbe0b, #fb5607); }   /* 30% */

        /* Хайлайт ефект за топче от печеливша линия (1 точка) */
        .ball.highlighted {
            box-shadow: 0 0 15px #fff, inset -3px -3px 8px rgba(0,0,0,0.6);
            border: 2px solid #fff;
            transform: scale(1.08);
        }

        /* Долен панел */
        .game-footer {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Хедър -->
    <header class="game-header">
        <div class="player-info">
            <span class="player-avatar" id="displayAvatar">🐸</span>
            <span id="displayName">Играч</span>
        </div>
        <div class="game-stats">
            <div>Точки: <span id="score">0</span></div>
            <div>Време: <span id="timer">60</span>s</div>
        </div>
    </header>

    <!-- Арена -->
    <div class="arena-container" id="arena">
        <div class="quadrant" data-quad-index="0"></div>
        <div class="quadrant" data-quad-index="1"></div>
        <div class="quadrant" data-quad-index="2"></div>
        <div class="quadrant" data-quad-index="3"></div>
    </div>

    <!-- Долен панел -->
    <div class="game-footer">
        <button class="btn" id="btnBack">Изход в менюто</button>
    </div>

    <script>
        document.getElementById('displayName').textContent = localStorage.getItem('quadratee_name') || 'Играч';
        document.getElementById('displayAvatar').textContent = localStorage.getItem('quadratee_avatar') || '🐸';

        function getRandomColorClass() {
            const rand = Math.random() * 100;
            if (rand < 40) return 'ball-magenta';
            if (rand < 70) return 'ball-indigo';
            return 'ball-gold';
        }

        let boardState = [
            [getRandomColorClass(), getRandomColorClass(), getRandomColorClass(), getRandomColorClass()],
            [getRandomColorClass(), getRandomColorClass(), getRandomColorClass(), getRandomColorClass()],
            [getRandomColorClass(), getRandomColorClass(), getRandomColorClass(), getRandomColorClass()],
            [getRandomColorClass(), getRandomColorClass(), getRandomColorClass(), getRandomColorClass()]
        ];

        const quadElements = document.querySelectorAll('.quadrant');

        // Създаване на пълна 4х4 матрица от четирите квадранта
        function getFullBoardMatrix() {
            let full = [
                [null, null, null, null],
                [null, null, null, null],
                [null, null, null, null],
                [null, null, null, null]
            ];

            // Квадрант 0 (горе-ляво) -> редове 0-1, колони 0-1
            full[0][0] = boardState[0][0]; full[0][1] = boardState[0][1];
            full[1][0] = boardState[0][2]; full[1][1] = boardState[0][3];

            // Квадрант 1 (горе-дясно) -> редове 0-1, колони 2-3
            full[0][2] = boardState[1][0]; full[0][3] = boardState[1][1];
            full[1][2] = boardState[1][2]; full[1][3] = boardState[1][3];

            // Квадрант 2 (долу-ляво) -> редове 2-3, колони 0-1
            full[2][0] = boardState[2][0]; full[2][1] = boardState[2][1];
            full[3][0] = boardState[2][2]; full[3][1] = boardState[2][3];

            // Квадрант 3 (долу-дясно) -> редове 2-3, колони 2-3
            full[2][2] = boardState[3][0]; full[2][3] = boardState[3][1];
            full[3][2] = boardState[3][2]; full[3][3] = boardState[3][3];

            return full;
        }

        // Проверка за хоризонтални и вертикални линии (3 или 4 еднакви)
        function checkCombinations() {
            let fullMatrix = getFullBoardMatrix();
            let isHighlighted = Array(4).fill(0).map(() => Array(4).fill(false));

            // Проверка по редове (хоризонтала)
            for (let r = 0; r < 4; r++) {
                let count = 1;
                for (let c = 1; c < 4; c++) {
                    if (fullMatrix[r][c] && fullMatrix[r][c] === fullMatrix[r][c - 1]) {
                        count++;
                    } else {
                        if (count >= 3) {
                            for (let i = 0; i < count; i++) {
                                isHighlighted[r][c - 1 - i] = true;
                            }
                        }
                        count = 1;
                    }
                }
                if (count >= 3) {
                    for (let i = 0; i < count; i++) {
                        isHighlighted[r][3 - i] = true;
                    }
                }
            }

            // Проверка по колони (вертикала)
            for (let c = 0; c < 4; c++) {
                let count = 1;
                for (let r = 1; r < 4; r++) {
                    if (fullMatrix[r][c] && fullMatrix[r][c] === fullMatrix[r - 1][c]) {
                        count++;
                    } else {
                        if (count >= 3) {
                            for (let i = 0; i < count; i++) {
                                isHighlighted[r - 1 - i][c] = true;
                            }
                        }
                        count = 1;
                    }
                }
                if (count >= 3) {
                    for (let i = 0; i < count; i++) {
                        isHighlighted[3 - i][c] = true;
                    }
                }
            }

            return isHighlighted;
        }

        function renderBoard() {
            let highlightedMatrix = checkCombinations();
            let currentScore = 0;

            quadElements.forEach((quad, qIndex) => {
                quad.innerHTML = '';
                for (let i = 0; i < 4; i++) {
                    let colorClass = boardState[qIndex][i];
                    
                    // Реални координати в 4х4 матрицата за това топче
                    let r = Math.floor(qIndex / 2) * 2 + Math.floor(i / 2);
                    let c = (qIndex % 2) * 2 + (i % 2);

                    const ball = document.createElement('div');
                    ball.className = `ball ${colorClass}`;

                    if (highlightedMatrix[r][c]) {
                        ball.classList.add('highlighted');
                        currentScore += 1; // Всяко хайлайтнато топче дава 1 точка
                    }

                    quad.appendChild(ball);
                }
            });

            document.getElementById('score').textContent = currentScore;
        }

        renderBoard();

        // Клик с плъзгане на топчетата (FLIP), пресмятане на точките и импулс на бордъра
        quadElements.forEach(quad => {
            quad.addEventListener('click', () => {
                const qIndex = parseInt(quad.dataset.quadIndex);
                
                // 1. Записваме старите елементи и техните позиции преди промяната
                const oldBalls = Array.from(quad.querySelectorAll('.ball'));
                const oldRects = oldBalls.map(b => b.getBoundingClientRect());

                // 2. Математическо завъртане на масива по часовниковата стрелка
                const [tl, tr, bl, br] = boardState[qIndex];
                boardState[qIndex] = [bl, tl, br, tr];

                // 3. Рисуваме новата подредба и пресмятаме точките
                renderBoard();

                // 4. FLIP анимация за самите топчета
                const newBalls = Array.from(quad.querySelectorAll('.ball'));
                newBalls.forEach((newBall, i) => {
                    const oldRect = oldRects[i];
                    const newRect = newBall.getBoundingClientRect();

                    const dx = oldRect.left - newRect.left;
                    const dy = oldRect.top - newRect.top;

                    gsap.fromTo(newBall, 
                        { x: dx, y: dy, scale: 0.9, opacity: 0.8 },
                        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power2.out", overwrite: "auto" }
                    );
                });

                // 5. Светлинен импулс на бордъра на самия квадрант
                gsap.fromTo(quad, 
                    { borderColor: "rgba(56, 189, 248, 0.9)", scale: 0.98, boxShadow: "0 0 20px rgba(56, 189, 248, 0.4)" },
                    { borderColor: "rgba(255, 255, 255, 0.04)", scale: 1, boxShadow: "0 0 0px rgba(56, 189, 248, 0)", duration: 0.4, ease: "power2.out" }
                );
            });
        });

        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        gsap.from('.arena-container', { duration: 0.6, scale: 0.8, opacity: 0, ease: 'power2.out' });
    </script>
</body>
</html>
