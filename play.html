<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBQUADRATEE - Игрална Арена</title>
    <!-- GSAP за радио-въртенето -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.25);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Хедър / Информация за играча */
        .game-header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .player-avatar {
            font-size: 1.5rem;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Игрална Арена (2x2 квадранта, които образуват мрежа 4x4 за топчетата) */
        .arena-container {
            position: relative;
            width: 340px;
            height: 340px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px; /* Еднакво разстояние между квадрантите */
            padding: 12px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Квадрантите носят самите топчета и се въртят заедно */
        .quadrant {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px; /* Абсолютно същото разстояние, гарантиращо перфектна решетка без овърлап */
            padding: 10px;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .quadrant:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(30, 41, 59, 0.45);
        }

        /* Топчета - намалени с 1/3, перфектно центрирани и без риск от опиране */
        .ball {
            width: 82%;
            height: 82%;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Цветове на топчетата */
        .ball-red { background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a); }
        .ball-blue { background: radial-gradient(circle at 30% 30%, #4dabf7, #1864ab); }
        .ball-green { background: radial-gradient(circle at 30% 30%, #51cf66, #2b8a3e); }
        .ball-yellow { background: radial-gradient(circle at 30% 30%, #fcc419, #e67700); }

        /* Долен панел */
        .game-footer {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Хедър -->
    <header class="game-header">
        <div class="player-info">
            <span class="player-avatar" id="displayAvatar">🐸</span>
            <span id="displayName">Играч</span>
        </div>
        <div class="game-stats">
            <div>Точки: <span id="score">0</span></div>
            <div>Време: <span id="timer">60</span>s</div>
        </div>
    </header>

    <!-- Арена -->
    <div class="arena-container" id="arena">
        <div class="quadrant" data-quad-index="0"></div>
        <div class="quadrant" data-quad-index="1"></div>
        <div class="quadrant" data-quad-index="2"></div>
        <div class="quadrant" data-quad-index="3"></div>
    </div>

    <!-- Долен панел -->
    <div class="game-footer">
        <button class="btn" id="btnBack">Изход в менюто</button>
    </div>

    <script>
        document.getElementById('displayName').textContent = localStorage.getItem('quadratee_name') || 'Играч';
        document.getElementById('displayAvatar').textContent = localStorage.getItem('quadratee_avatar') || '🐸';

        let boardState = [
            ['ball-red', 'ball-blue', 'ball-green', 'ball-yellow'],  
            ['ball-yellow', 'ball-green', 'ball-blue', 'ball-red'],  
            ['ball-blue', 'ball-red', 'ball-yellow', 'ball-green'],  
            ['ball-green', 'ball-yellow', 'ball-red', 'ball-blue']   
        ];

        const quadElements = document.querySelectorAll('.quadrant');

        function renderBoard() {
            quadElements.forEach((quad, qIndex) => {
                quad.innerHTML = '';
                boardState[qIndex].forEach(colorClass => {
                    const ball = document.createElement('div');
                    ball.className = `ball ${colorClass}`;
                    quad.appendChild(ball);
                });
            });
        }

        renderBoard();

        quadElements.forEach(quad => {
            let currentRotation = 0;

            quad.addEventListener('click', () => {
                const qIndex = parseInt(quad.dataset.quadIndex);
                currentRotation += 90;

                gsap.to(quad, {
                    rotation: currentRotation,
                    duration: 0.4,
                    ease: "back.out(1.7)",
                    overwrite: "auto",
                    onComplete: () => {
                        const [tl, tr, bl, br] = boardState[qIndex];
                        boardState[qIndex] = [bl, tl, br, tr];
                        checkWinningLines();
                    }
                });
            });
        });

        function checkWinningLines() {
            console.log("Проверка за печеливши линии...");
        }

        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        gsap.from('.arena-container', { duration: 0.6, scale: 0.8, opacity: 0, ease: 'power2.out' });
    </script>
</body>
</html>
