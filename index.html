<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratee - Начало</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .home-arcade-screen {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
        }

        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .home-avatar-btn, .settings-gear-btn {
            background: #1e293b;
            border: 1px solid #334155;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #38bdf8;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .arcade-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .bonus-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #38bdf8;
        }

        .bonus-text {
            font-size: 11px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .arcade-divider-text {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .arcade-code-boxes {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .code-box-input {
            width: 50px;
            height: 50px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .code-box-input:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            background: #1e293b;
        }

        .primary-arcade-btn {
            display: block;
            width: 100%;
            max-width: 280px;
            background: #0ea5e9;
            color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            margin: 0 auto;
        }

        .primary-arcade-btn:hover {
            background: #0284c7;
        }

        .arcade-footer {
            text-align: center;
            margin-bottom: 10px;
        }

        .arcade-logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-author-text {
            font-size: 11px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b; padding: 25px; border-radius: 16px;
            text-align: center; color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 320px; width: 100%; border: 1px solid #334155;
        }

        .modal-content h3 { margin-bottom: 15px; color: #38bdf8; font-size: 16px; }

        .close-btn {
            float: right; font-size: 24px; cursor: pointer; color: #94a3b8; line-height: 15px;
        }
        .close-btn:hover { color: #ffffff; }

        .language-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .lang-option-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            padding-left: 20px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .lang-option-btn:hover {
            background: #334155;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .scanner-viewfinder {
            width: 100%;
            height: 180px;
            background: #0f172a;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container home-arcade-screen">
        <header class="home-header">
            <div class="home-avatar-btn" title="Профил">🤖</div>
            <button id="lang-settings-btn" class="settings-gear-btn" title="Настройки на езика">⚙️</button>
        </header>

        <div class="arcade-card">
            <div class="diamonds-badge bonus-badge">
                💎 150 <span class="bonus-text">Daily Bonus</span>
            </div>

            <div class="arcade-divider-text">ВЗЕМИ ОЩЕ ДИАМАНТИ</div>

            <div class="arcade-code-boxes">
                <input type="text" maxlength="1" class="code-box-input" data-index="0" />
                <input type="text" maxlength="1" class="code-box-input" data-index="1" />
                <input type="text" maxlength="1" class="code-box-input" data-index="2" />
                <input type="text" maxlength="1" class="code-box-input" data-index="3" />
            </div>

            <button id="qr-scan-btn" class="arcade-btn primary-arcade-btn">ВЗЕМИ QR КОД</button>
        </div>

        <footer class="arcade-footer">
            <div class="arcade-logo-text">quadratee</div>
            <div class="arcade-author-text">by 10012</div>
        </footer>
    </div>

    <div id="lang-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-lang" class="close-btn">&times;</span>
            <h3>Изберете език / Select Language</h3>
            <div class="language-options">
                <button class="lang-option-btn" data-lang="en">🇬🇧 English</button>
                <button class="lang-option-btn" data-lang="de">🇩🇪 Deutsch</button>
                <button class="lang-option-btn" data-lang="fr">🇫🇷 Français</button>
                <button class="lang-option-btn" data-lang="it">🇮🇹 Italiano</button>
            </div>
        </div>
    </div>

    <div id="qr-scanner-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-scanner" class="close-btn">&times;</span>
            <h3>Сканиране на QR код</h3>
            <div class="scanner-viewfinder">
                📷 Камерата е активна...<br>Насочете към QR кода
            </div>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 15px;">Свързване към играта на друг потребител</p>
        </div>
    </div>

    <script src="home-script.js"></script>
</body>
</html>
