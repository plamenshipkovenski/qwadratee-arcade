<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBQUADRATEE - Меню</title>
    <!-- GSAP за плавни преходи -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        /* Аватари */
        .avatar-picker {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .avatar-btn {
            font-size: 1.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }

        .avatar-btn.selected {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.15);
            transform: scale(1.05);
        }

        /* Инпут за Име */
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        /* Палитри */
        .palette-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .palette-btn {
            height: 40px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            overflow: hidden;
            padding: 3px;
            background: rgba(0, 0, 0, 0.3);
        }

        .palette-btn.selected {
            border-color: var(--accent-color);
        }

        .palette-color {
            flex: 1;
            height: 100%;
            border-radius: 4px;
        }

        /* Бутони Режими */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #0f172a;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Мултиплейър Секция */
        .multiplayer-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        .code-input-group {
            display: flex;
            gap: 8px;
        }

        .code-input-group input {
            text-align: center;
            letter-spacing: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu-card" id="menuCard">
        <h1 class="title">QUADRATEE</h1>

        <!-- Избор на Аватар -->
        <div>
            <div class="section-title">Избери аватар</div>
            <div class="avatar-picker" id="avatarPicker">
                <button class="avatar-btn selected" data-avatar="🐸">🐸</button>
                <button class="avatar-btn" data-avatar="🦊">🦊</button>
                <button class="avatar-btn" data-avatar="🤖">🤖</button>
                <button class="avatar-btn" data-avatar="👾">👾</button>
                <button class="avatar-btn" data-avatar="🚀">🚀</button>
            </div>
        </div>

        <!-- Поле за Име -->
        <div>
            <div class="section-title">Име на играч</div>
            <input type="text" id="playerName" placeholder="Въведи име..." maxlength="12">
        </div>

        <!-- Избор на Цветова Палитра -->
        <div>
            <div class="section-title">Тема / Палитра</div>
            <div class="palette-picker" id="palettePicker">
                <button class="palette-btn selected" data-theme="neon">
                    <span class="palette-color" style="background: #38bdf8;"></span>
                    <span class="palette-color" style="background: #f43f5e;"></span>
                    <span class="palette-color" style="background: #a855f7;"></span>
                </button>
                <button class="palette-btn" data-theme="cyber">
                    <span class="palette-color" style="background: #22c55e;"></span>
                    <span class="palette-color" style="background: #eab308;"></span>
                    <span class="palette-color" style="background: #ec4899;"></span>
                </button>
                <button class="palette-btn" data-theme="sunset">
                    <span class="palette-color" style="background: #f97316;"></span>
                    <span class="palette-color" style="background: #06b6d4;"></span>
                    <span class="palette-color" style="background: #8b5cf6;"></span>
                </button>
            </div>
        </div>

        <!-- Режими на Игра -->
        <div class="actions">
            <button class="btn btn-primary" id="btnSolo">🎮 СОЛО АРКАДА</button>
            <button class="btn btn-secondary" id="btnMultiToggle">👥 МУЛТИПЛЕЙЪР ДУЕЛ</button>

            <!-- Разгъващ се панел за Мултиплейър -->
            <div class="multiplayer-box" id="multiBox">
                <button class="btn btn-primary" id="btnCreateRoom" style="width:100%;">⚡ Създай стая</button>
                <div class="code-input-group">
                    <input type="text" id="roomCode" placeholder="4-цифрен код" maxlength="4">
                    <button class="btn btn-secondary" id="btnJoinRoom">Влез</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            avatar: localStorage.getItem('quadratee_avatar') || '🐸',
            name: localStorage.getItem('quadratee_name') || 'Играч 1',
            theme: localStorage.getItem('quadratee_theme') || 'neon'
        };

        document.getElementById('playerName').value = state.name;

        const avatarBtns = document.querySelectorAll('.avatar-btn');
        avatarBtns.forEach(btn => {
            if (btn.dataset.avatar === state.avatar) {
                avatarBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            }
            btn.addEventListener('click', () => {
                avatarBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                state.avatar = btn.dataset.avatar;
                localStorage.setItem('quadratee_avatar', state.avatar);
            });
        });

        const paletteBtns = document.querySelectorAll('.palette-btn');
        paletteBtns.forEach(btn => {
            if (btn.dataset.theme === state.theme) {
                paletteBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            }
            btn.addEventListener('click', () => {
                paletteBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                state.theme = btn.dataset.theme;
                localStorage.setItem('quadratee_theme', state.theme);
            });
        });

        const nameInput = document.getElementById('playerName');
        nameInput.addEventListener('input', (e) => {
            state.name = e.target.value || 'Играч 1';
            localStorage.setItem('quadratee_name', state.name);
        });

        const multiBox = document.getElementById('multiBox');
        document.getElementById('btnMultiToggle').addEventListener('click', () => {
            const isHidden = multiBox.style.display === 'none' || !multiBox.style.display;
            multiBox.style.display = isHidden ? 'flex' : 'none';
        });

        document.getElementById('btnSolo').addEventListener('click', () => {
            window.location.href = 'play.html?mode=solo';
        });

        document.getElementById('btnCreateRoom').addEventListener('click', () => {
            const generatedCode = Math.floor(1000 + Math.random() * 9000);
            window.location.href = `play.html?mode=multi&role=host&room=${generatedCode}`;
        });

        document.getElementById('btnJoinRoom').addEventListener('click', () => {
            const code = document.getElementById('roomCode').value.trim();
            if (code.length === 4) {
                window.location.href = `play.html?mode=multi&role=guest&room=${code}`;
            } else {
                alert('Моля въведете валиден 4-цифрен код!');
            }
        });

        gsap.from('#menuCard', { duration: 0.6, y: 30, opacity: 0, ease: 'power2.out' });
    </script>
</body>
</html>
