<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratee - Активна игра</title>
    <style>
        @keyframes pulseZoom {
            0% { transform: scale(1); color: #38bdf8; }
            50% { transform: scale(1.3); color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
            100% { transform: scale(1); color: #38bdf8; }
        }

        .timer-urgent {
            animation: pulseZoom 0.6s infinite ease-in-out;
        }

        .circle.winning {
            border: 2px solid rgba(255, 255, 255, 0.9) !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .game-info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .player-mini-avatar {
            font-size: 18px;
            background: #0f172a;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid #334155;
            cursor: pointer;
        }

        .game-timer {
            font-weight: bold;
            color: #38bdf8;
            font-size: 16px;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .game-diamonds-badge {
            font-weight: bold;
            color: #38bdf8;
            font-size: 14px;
            background: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .board-4x4-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            background: #1e293b;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
        }

        .quadrant-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            justify-items: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s ease;
        }

        .quadrant-box:hover {
            border-color: #38bdf8;
        }

        .circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
        }

        .circle.color-a { background-color: var(--c-primary, #ec4899); }
        .circle.color-b { background-color: var(--c-secondary, #06b6d4); }
        .circle.color-c { background-color: var(--c-tertiary, #eab308); }

        .controls-bottom-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stop-game-btn {
            display: block;
            width: 100%;
            background: #ef4444;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
            transition: background 0.2s;
        }

        .stop-game-btn:hover {
            background: #dc2626;
        }

        .back-btn-link {
            display: block;
            width: 100%;
            background: #334155;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .back-btn-link:hover {
            background: #475569;
            color: #ffffff;
        }

        /* --- Стил за новите стклени (Glassmorphism) модали --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .modal-title-win {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .modal-title-lose {
            font-size: 24px;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .modal-diamonds-big {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 16px;
        }

        .modal-stats {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 15px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .modal-formula {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            font-style: italic;
        }

        .modal-lose-text {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .modal-zero-red {
            font-size: 38px;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 16px;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        .modal-btn {
            display: block;
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #0ea5e9;
        }

        .modal-btn-green {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .modal-btn-green:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="game-info-header">
            <div id="player-avatar-btn" class="player-mini-avatar" title="Аватар на играча">🤖</div>
            <div id="timer-display" class="game-timer">02:45</div>
            <div class="game-diamonds-badge">💎 <span id="diamonds-count">150</span></div>
        </header>

        <div class="board-4x4-grid" id="game-board">
            <div class="quadrant-box" data-quadrant="0">
                <div class="circle ball color-a" data-local="0"></div>
                <div class="circle ball color-b" data-local="1"></div>
                <div class="circle ball color-c" data-local="2"></div>
                <div class="circle ball color-a" data-local="3"></div>
            </div>
            <div class="quadrant-box" data-quadrant="1">
                <div class="circle ball color-b" data-local="0"></div>
                <div class="circle ball color-c" data-local="1"></div>
                <div class="circle ball color-a" data-local="2"></div>
                <div class="circle ball color-b" data-local="3"></div>
            </div>
            <div class="quadrant-box" data-quadrant="2">
                <div class="circle ball color-c" data-local="0"></div>
                <div class="circle ball color-a" data-local="1"></div>
                <div class="circle ball color-b" data-local="2"></div>
                <div class="circle ball color-c" data-local="3"></div>
            </div>
            <div class="quadrant-box" data-quadrant="3">
                <div class="circle ball color-a" data-local="0"></div>
                <div class="circle ball color-b" data-local="1"></div>
                <div class="circle ball color-c" data-local="2"></div>
                <div class="circle ball color-a" data-local="3"></div>
            </div>
        </div>

        <div class="controls-bottom-container">
            <button id="stop-game-btn" class="stop-game-btn">СТОП ИГРА</button>
            <a href="index.html" class="back-btn-link">НАЗАД КЪМ НАЧАЛОТО</a>
        </div>
    </div>

    <!-- Модал 1: Успешен завършек (Спряна игра) -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title-win">ТИ СПЕЧЕЛИ!!!</div>
            <div class="modal-diamonds-big">+<span id="modal-added-diamonds">1500</span> 💎</div>
            <div class="modal-stats">
                <div>Таймер: <span id="modal-time-val">150</span> сек.</div>
                <div>Активирани топки: <span id="modal-balls-val">10</span></div>
            </div>
            <div class="modal-formula">(<span id="modal-formula-mult">150</span> х <span id="modal-formula-balls">10</span> = <span id="modal-formula-res">1500</span>)</div>
            <button id="modal-try-again-btn" class="modal-btn">Опитай пак</button>
        </div>
    </div>

    <!-- Модал 2: Изтекло време (Загуба) -->
    <div id="lose-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title-lose">КРАЙ!</div>
            <div class="modal-lose-text">Спечелени диаманти</div>
            <div class="modal-zero-red">💎 0 😁</div>
            <button id="modal-new-arcade-btn" class="modal-btn modal-btn-green">Нова аркада</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const palettes = {
                '1': { primary: '#ec4899', secondary: '#06b6d4', tertiary: '#eab308' },
                '2': { primary: '#8b5cf6', secondary: '#10b981', tertiary: '#f97316' },
                '3': { primary: '#3b82f6', secondary: '#ef4444', tertiary: '#14b8a6' }
            };

            const savedPaletteKey = localStorage.getItem('quadratee_palette') || '1';
            const activePalette = palettes[savedPaletteKey] || palettes['1'];

            document.documentElement.style.setProperty('--c-primary', activePalette.primary);
            document.documentElement.style.setProperty('--c-secondary', activePalette.secondary);
            document.documentElement.style.setProperty('--c-tertiary', activePalette.tertiary);

            const colorTypes = ['color-a', 'color-b', 'color-c'];
            
            let quadrantsState = [
                [colorTypes[0], colorTypes[0], colorTypes[0], colorTypes[1]],
                [colorTypes[1], colorTypes[2], colorTypes[1], colorTypes[2]],
                [colorTypes[2], colorTypes[2], colorTypes[2], colorTypes[0]],
                [colorTypes[0], colorTypes[1], colorTypes[2], colorTypes.sort(() => Math.random() - 0.5)[0]]
            ];

            const currentDir = localStorage.getItem('quadratee_dir') || 'right';
            const quadrants = document.querySelectorAll('.quadrant-box');
            let animatingQuadrants = new Set();
            let isGameActive = true;

            function renderBoard() {
                quadrants.forEach((quad, qIndex) => {
                    let balls = quad.querySelectorAll('.ball');
                    let colors = quadrantsState[qIndex];
                    balls.forEach((ball, bIdx) => {
                        ball.className = 'circle ball ' + colors[bIdx];
                        ball.classList.remove('winning');
                    });
                });
            }

            renderBoard();

            function checkAndHighlightWins() {
                document.querySelectorAll('.board-4x4-grid .ball').forEach(b => b.classList.remove('winning'));

                let visualMatrix = Array(4).fill(null).map(() => Array(4).fill(''));
                let ballElementsMatrix = Array(4).fill(null).map(() => Array(4).fill(null));

                quadrants.forEach((quad, qIndex) => {
                    let startR = Math.floor(qIndex / 2) * 2;
                    let startC = (qIndex % 2) * 2;

                    let balls = quad.querySelectorAll('.ball');
                    let mapping = [
                        {r: startR, c: startC},
                        {r: startR, c: startC + 1},
                        {r: startR + 1, c: startC},
                        {r: startR + 1, c: startC + 1}
                    ];

                    balls.forEach((ball, bIdx) => {
                        let pos = mapping[bIdx];
                        let color = 'color-a';
                        if (ball.classList.contains('color-b')) color = 'color-b';
                        if (ball.classList.contains('color-c')) color = 'color-c';
                        if (ball.classList.contains('color-a')) color = 'color-a';

                        visualMatrix[pos.r][pos.c] = color;
                        ballElementsMatrix[pos.r][pos.c] = ball;
                    });
                });

                let winningCoords = new Set();

                for (let r = 0; r < 4; r++) {
                    let count = 1;
                    for (let c = 0; c < 3; c++) {
                        if (visualMatrix[r][c] !== '' && visualMatrix[r][c] === visualMatrix[r][c+1]) {
                            count++;
                        } else {
                            if (count >= 3) {
                                for (let k = 0; k < count; k++) {
                                    winningCoords.add(`${r},${c - count + 1 + k}`);
                                }
                            }
                            count = 1;
                        }
                    }
                    if (count >= 3) {
                        for (let k = 0; k < count; k++) {
                            winningCoords.add(`${r},${4 - count + k}`);
                        }
                    }
                }

                for (let c = 0; c < 4; c++) {
                    let count = 1;
                    for (let r = 0; r < 3; r++) {
                        if (visualMatrix[r][c] !== '' && visualMatrix[r][c] === visualMatrix[r+1][c]) {
                            count++;
                        } else {
                            if (count >= 3) {
                                for (let k = 0; k < count; k++) {
                                    winningCoords.add(`${r - count + 1 + k},${c}`);
                                }
                            }
                            count = 1;
                        }
                    }
                    if (count >= 3) {
                        for (let k = 0; k < count; k++) {
                            winningCoords.add(`${4 - count + k},${c}`);
                        }
                    }
                }

                winningCoords.forEach(coord => {
                    let [r, c] = coord.split(',').map(Number);
                    if (ballElementsMatrix[r][c]) {
                        ballElementsMatrix[r][c].classList.add('winning');
                    }
                });
            }

            checkAndHighlightWins();

            quadrants.forEach((quad, qIndex) => {
                quad.addEventListener('click', () => {
                    if (!isGameActive || animatingQuadrants.has(qIndex)) return;
                    animatingQuadrants.add(qIndex);

                    let colors = quadrantsState[qIndex];
                    let balls = quad.querySelectorAll('.ball');

                    let spinAngle = (currentDir === 'right') ? 'rotate(90deg) scale(0.85)' : 'rotate(-90deg) scale(0.85)';
                    balls.forEach(b => {
                        b.style.transform = spinAngle;
                    });

                    setTimeout(() => {
                        if (currentDir === 'right') {
                            let temp = colors[0];
                            colors[0] = colors[2]; 
                            colors[2] = colors[3]; 
                            colors[3] = colors[1]; 
                            colors[1] = temp;      
                        } else {
                            let temp = colors[0];
                            colors[0] = colors[1]; 
                            colors[1] = colors[3]; 
                            colors[3] = colors[2]; 
                            colors[2] = temp;      
                        }

                        renderBoard();
                        checkAndHighlightWins();

                        balls.forEach(b => {
                            b.style.transform = 'rotate(0deg) scale(1)';
                        });
                        animatingQuadrants.delete(qIndex);
                    }, 200);
                });
            });

            let timeLeft = 165;
            const timerDisplay = document.getElementById('timer-display');
            
            const timerInterval = setInterval(() => {
                if (!isGameActive) return;

                if (timeLeft > 0) {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                    if (timeLeft === 2) {
                        timerDisplay.classList.add('timer-urgent');
                    }

                    if (timeLeft === 0) {
                        clearInterval(timerInterval);
                        isGameActive = false;
                        timerDisplay.classList.remove('timer-urgent');
                        
                        // Показване на втория модал (Загуба - изтекло време)
                        document.getElementById('lose-modal').classList.add('active');
                    }
                }
            }, 1000);

            // Бутон СТОП ИГРА
            const stopBtn = document.getElementById('stop-game-btn');
            stopBtn.addEventListener('click', () => {
                if (!isGameActive) return;
                clearInterval(timerInterval);
                isGameActive = false;

                const winningBalls = document.querySelectorAll('.board-4x4-grid .ball.winning');
                let activeScoreCount = winningBalls.length;

                let multiplier = (timeLeft <= 1) ? 0 : timeLeft;
                let bonusScore = multiplier * activeScoreCount;
                
                let currentDiamonds = parseInt(document.getElementById('diamonds-count').textContent) || 150;
                let totalDiamonds = currentDiamonds + bonusScore;

                document.getElementById('diamonds-count').textContent = totalDiamonds;

                // Попълване на данните в първия модал (Успех)
                document.getElementById('modal-added-diamonds').textContent = bonusScore;
                document.getElementById('modal-time-val').textContent = timeLeft;
                document.getElementById('modal-balls-val').textContent = activeScoreCount;
                document.getElementById('modal-formula-mult').textContent = multiplier;
                document.getElementById('modal-formula-balls').textContent = activeScoreCount;
                document.getElementById('modal-formula-res').textContent = bonusScore;

                document.getElementById('win-modal').classList.add('active');
            });

            // Бутони за действие в модалите
            document.getElementById('modal-try-again-btn').addEventListener('click', () => {
                location.reload(); // Рестартиране на играта
            });

            document.getElementById('modal-new-arcade-btn').addEventListener('click', () => {
                window.location.href = 'game.html'; // Препращане към game.html
            });
        });
    </script>
</body>
</html>
